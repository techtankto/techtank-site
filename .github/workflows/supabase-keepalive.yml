# Keeps the free-tier Supabase project from pausing due to 7-day inactivity.
# Runs twice daily at off-peak minutes (GitHub drops or delays jobs queued at :00)
# and calls /api/health, which executes a lightweight uncached read against
# `contribution_tasks` using Vercel's production Supabase config.
#
# Caveat: GitHub disables scheduled workflows on public repos after 60 days
# without repository activity. Re-enable this workflow in the Actions tab if
# the repo ever goes quiet for two months.

name: Supabase Keepalive

permissions: {}

on:
  schedule:
    - cron: "17 6,18 * * *"
  workflow_dispatch:

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          HEALTH_URL: https://www.techtankto.com/api/health
        run: |
          set -euo pipefail

          # Send two uncached reads per run (four/day) to satisfy Supabase's
          # rolling 7-day database activity threshold.
          for i in 1 2; do
            body_file=$(mktemp)
            status=$(curl -sS -o "$body_file" -w "%{http_code}" \
              --retry 3 --retry-all-errors --retry-delay 10 --max-time 20 \
              "$HEALTH_URL")

            echo "Ping ${i}: HTTP ${status}"
            if [ "$status" != "200" ] || ! grep -q '"ok":true' "$body_file"; then
              rm -f "$body_file"
              echo "::error::Health check ping ${i} failed (HTTP ${status})."
              exit 1
            fi
            rm -f "$body_file"

            if [ "$i" -lt 2 ]; then
              sleep 2
            fi
          done

  notify:
    needs: ping
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          title="[Supabase] Keepalive ping failed"
          timestamp=$(date -u +"%Y-%m-%d %H:%M UTC")
          body=$(cat <<EOF
          The scheduled Supabase keepalive workflow failed at ${timestamp}.

          - **Latest failed run:** ${RUN_URL}

          ## Triage

          1. **HTTP \`503\`:** the Supabase project may be paused, or Vercel's \`NEXT_PUBLIC_SUPABASE_URL\` / \`NEXT_PUBLIC_SUPABASE_ANON_KEY\` env vars may be misconfigured. Check the Supabase dashboard (resume the project if paused) and Vercel function logs for \`/api/health\`.
          2. **Other HTTP error or timeout:** check the Vercel deployment status for \`https://www.techtankto.com/api/health\`.
          3. After fixing, re-run **Supabase Keepalive** from the Actions tab to confirm HTTP \`200\`.
          EOF
          )

          existing=$(gh issue list \
            --state open \
            --search "in:title \"${title}\"" \
            --json number,title \
            --jq "[.[] | select(.title == \"${title}\") | .number][0] // empty")

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
            echo "Updated open issue #${existing}."
          else
            gh issue create --title "$title" --label bug --body "$body"
          fi
