name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/oxlint-tailwindcss
          key: oxlint-tailwindcss-${{ hashFiles('app/globals.css', 'pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: oxlint-tailwindcss-${{ hashFiles('app/globals.css', 'pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
        env:
          OXLINT_TAILWINDCSS_CACHE_DIR: ${{ runner.temp }}/oxlint-tailwindcss
      - run: pnpm test
